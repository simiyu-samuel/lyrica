<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6fc"/>
      <stop offset="100%" stop-color="#ede7fa"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17161c"/>
      <stop offset="100%" stop-color="#7c55d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="75" r="150" fill="#cfc1ef" opacity=".28">
    <animate attributeName="r" values="145;155;145" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="245" r="130" fill="#dccaf1" opacity=".35">
    <animate attributeName="r" values="125;140;125" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(420 78)">
    <g fill="#7c55d9" transform="translate(0 18)">
      <rect x="0" y="28" width="10" height="32" rx="5">
        <animate attributeName="height" values="32;60;32" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="28;0;28" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="5" width="10" height="55" rx="5">
        <animate attributeName="height" values="55;26;55" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="5;34;5" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="18" width="10" height="42" rx="5">
        <animate attributeName="height" values="42;68;42" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;-8;18" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="34" width="10" height="26" rx="5">
        <animate attributeName="height" values="26;48;26" dur=".9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="34;12;34" dur=".9s" repeatCount="indefinite"/>
